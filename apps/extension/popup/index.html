<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LeetHub-AI Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>LeetHub-AI</h2>
    <div id="status" class="status-disconnected">Not Connected</div>
    
    <div id="connect-section">
      <p>Enter the pairing code from your web dashboard.</p>
      <input type="text" id="pairing-code" placeholder="123456" maxlength="6" />
      <button id="link-btn">Connect</button>
      <div id="error-msg" class="error"></div>
    </div>
    
    <div id="connected-section" style="display: none;">
      <p>Your extension is securely connected!</p>
      <button id="unlink-btn">Disconnect</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>

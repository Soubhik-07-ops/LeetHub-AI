<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LeetBranch Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h2>LeetBranch</h2>
    <div id="status-indicator" class="status-indicator status-disconnected">
      <div class="status-dot"></div>
      <span class="status-text" id="status-text">Not Connected</span>
    </div>
  </div>

  <div class="container">
    <div id="connect-section">
      <p>Enter the pairing code from your web dashboard.</p>
      <input type="text" id="pairing-code" placeholder="123456" maxlength="6" />
      <button id="link-btn">Connect</button>
      <div id="error-msg" class="error"></div>
    </div>
    
    <div id="connected-section" style="display: none;">
      <p style="margin-bottom: 12px;">Your extension is securely connected!</p>
      
      <div id="recent-submission" class="submission-card" style="display: none;">
        <h3>Recent Submission</h3>
        <div class="submission-details">
          <div id="sub-title"></div>
          <div><span id="sub-status" class="badge"></span></div>
          <div id="sub-date" style="font-size: 10px; margin-top: 4px; color: #64748b;"></div>
        </div>
      </div>

      <button id="dashboard-btn" style="margin-top: 12px; background: rgba(255, 255, 255, 0.1);">Open Dashboard</button>
      <button id="unlink-btn">Disconnect</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
